name: heredoc variable test

on:
  # test in isolation
  push:

jobs:
  heredoc:  # Basic heredoc works fine
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  multiple:  # Basic heredoc works fine
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
        echo "bar<<EOF" | tee -a $GITHUB_OUTPUT
        echo "2" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "foo=$foo bar=$bar"
      env:
        foo: ${{ steps.test.outputs.foo }}
        bar: ${{ steps.test.outputs.bar }}


  missing:
    name: "Missing end terminator is an error"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  minus:
    name: "Minus: <<-EOF to support leading tabs inside doc does not work"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "minus<<-EOF" | tee -a $GITHUB_OUTPUT
        echo "	a line starting with tab and containing EOF but that's fine" | tee -a $GITHUB_OUTPUT
        echo "	EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.minus }}

  minus-is-literal:
    name: "Minus: <<-EOF is treated as a literal delimiter"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "minus<<-EOF" | tee -a $GITHUB_OUTPUT
        echo "some text" | tee -a $GITHUB_OUTPUT
        echo "-EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.minus }}

  expansion:
    name: "Expansion: Shell-like variable expansion is ignored."
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "exp<<EOF" | tee -a $GITHUB_OUTPUT
        echo 'pwd is $PWD' | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.exp }}

  quote:
    name: "Quotes: Quotes for escaping of contents does not work"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "quote<<'EOF'" | tee -a $GITHUB_OUTPUT
        echo 'pwd is $PWD' | tee -a $GITHUB_OUTPUT
        echo 'pwdcmd is `pwd`' | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.quote }}

  space-after-arrow:
    name: "Space before delimiter: Does not support heredoc optional space <<EOF vs << EOF."
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "space<< EOF" | tee -a $GITHUB_OUTPUT
        echo "text" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.space }}

  space-before-arrow:
    name: "Space before arrow: Value is dropped"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo <<EOF" | tee -a $GITHUB_OUTPUT
        echo "text" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  multiple-one-line:
    name: "Assigning multiple values on one line impossible, whole string attached to one variable"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=1 bar=2" | tee -a $GITHUB_OUTPUT
    - run: echo "foo=$foo bar=$bar"
      env:
        foo: ${{ steps.test.outputs.foo }}
        bar: ${{ steps.test.outputs.bar }}

  semicolon:
    name: "Semicolon is ignored"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=1;bar=2" | tee -a $GITHUB_OUTPUT
    - run: echo "foo=$foo bar=$bar"
      env:
        foo: ${{ steps.test.outputs.foo }}
        bar: ${{ steps.test.outputs.bar }}

  overwite:
    name: "Overwrite: works, last value wins"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "overwrite=1" | tee -a $GITHUB_OUTPUT
        echo "overwrite=2" | tee -a $GITHUB_OUTPUT
        echo "overwrite=3" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.overwrite }}

  array:
    name: Bash array of values unsupported
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "arr=(" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "2" | tee -a $GITHUB_OUTPUT
        echo ")" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.arr }}

  comments:
    name: Comments during assignmemnt
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=1" | tee -a $GITHUB_OUTPUT
        echo "#comment=2" | tee -a $GITHUB_OUTPUT
        echo "bar=3" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  comments-inside-doc:
    name: Comments inside <<DOC
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<<DOC" | tee -a $GITHUB_OUTPUT
        echo "value"
        echo "#comment=2" | tee -a $GITHUB_OUTPUT
        echo "DOC" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  blank-lines:
    name: "Blank lines between items"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo==1" | tee -a $GITHUB_OUTPUT
        echo "" | tee -a $GITHUB_OUTPUT
        echo "bar==2" | tee -a $GITHUB_OUTPUT

    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  arrows-inside-value:
    name: "Arrows inside the value: foo=value<<with<<arrows"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=value<<with<arrows" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  value-inside-delimiter:
    name: "Arrows inside the delimiter: foo<<EOF=DOC"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<<EOF=DOC" | tee -a $GITHUB_OUTPUT
        echo "value" | tee -a $GITHUB_OUTPUT
        echo "EOF=DOC" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  single-arrow:
    name: "Single arrow in key: foo<=bar"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo<=bar" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  space-in-key-before-key:
    name: "Single space inside key: _foo=bar"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo " foo=bar" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  space-in-key-before-equal:
    name: "Single space inside key: foo =bar"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo =bar" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  space-in-mid-key:
    name: "Single space inside key: foo bar=1"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo bar=1" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  space-at-start-of-value:
    name: "Single space inside value: foo= bar"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo= bar" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  space-at-end-of-value:
    name: "Single space inside value: foo=bar "
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=bar " | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

  double-equals:
    name: "Double equals inside key: foo==bar"
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo==bar" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ toJSON(steps.test.outputs) }}

