name: heredoc variable test

on:
  # test in isolation
  push:

jobs:
  heredoc:  # Basic heredoc works fine
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  missing:  # Mising end terminator
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  minus:  # <<-EOF to support leading tabs does not work
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "minus=<<-EOF" | tee -a $GITHUB_OUTPUT
        echo "	a line starting with tab and containing EOF but that's fine" | tee -a $GITHUB_OUTPUT
        echo "	EOF" tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.minus }}

  expansion:  # Expansion does not work
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "exp=<<EOF" | tee -a $GITHUB_OUTPUT
        echo '\$\n' | tee -a $GITHUB_OUTPUT
        echo 'pwdenv is "$PWD"' | tee -a $GITHUB_OUTPUT
        echo 'pwdcmd is `pwd`' | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.expansion }}

  quote:  # Quotes for escaping of contents does not work (no expansion happens)
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "quote=<<'EOF'" | tee -a $GITHUB_OUTPUT
        echo '\$\n' | tee -a $GITHUB_OUTPUT
        echo 'pwdenv is "$PWD"' | tee -a $GITHUB_OUTPUT
        echo 'pwdcmd is `pwd`' | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.quote }}

  space:  # The redirect and the delimiting identifier do not need to be separated by a space: <<END or << END both work equally well.
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "space=<< EOF" | tee -a $GITHUB_OUTPUT
        echo "nospaceleft" | tee -a $GITHUB_OUTPUT
        echo "   space in the middle   " | tee -a $GITHUB_OUTPUT
        echo "nospaceright" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.space }}

  space-before-equal:  # Space before the equal character: 'foo ='
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo =<<EOF" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.foo }}

  multiple:  # Multiple per line?
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "foo=1 bar=2 baz=3" | tee -a $GITHUB_OUTPUT
    - run: echo "foo=$foo bar=$bar baz=$baz"
      env:
        foo: ${{ steps.test.outputs.foo }}
        bar: ${{ steps.test.outputs.bar }}
        baz: ${{ steps.test.outputs.baz }}

  extraspace:  # Extra spaces after = don't work
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "space= << EOF" | tee -a $GITHUB_OUTPUT
        echo "nospaceleft" | tee -a $GITHUB_OUTPUT
        echo "   space in the middle   " | tee -a $GITHUB_OUTPUT
        echo "nospaceright" | tee -a $GITHUB_OUTPUT
        echo "EOF" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.extraspace }}

  overwite:  # Overwrite works, last value wins
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "overwrite=1" | tee -a $GITHUB_OUTPUT
        echo "overwrite=2" | tee -a $GITHUB_OUTPUT
        echo "overwrite=3" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.overwrite }}


  array:  # Array of values without heredoc
    runs-on: ubuntu-latest
    steps:
    - id: test
      run: |
        echo "arr=(" | tee -a $GITHUB_OUTPUT
        echo "1" | tee -a $GITHUB_OUTPUT
        echo "2" | tee -a $GITHUB_OUTPUT
        echo ")" | tee -a $GITHUB_OUTPUT
    - run: echo "$value"
      env:
        value: ${{ steps.test.outputs.arr }}
